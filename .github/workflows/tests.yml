name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run black-box + white-box tests with coverage
        # A failing test is a LEGITIMATE result before the defect-fix PR is merged:
        # the job turns red, but the next step still uploads the evidence.
        run: >
          python -m pytest tests/ -v
          --junitxml=test-results.xml
          --cov=registration --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-evidence
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
